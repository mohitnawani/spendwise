databases:
  - name: spendwise-db
    databaseName: spendwise
    user: spendwise
    plan: free

services:
  - type: web
    name: spendwise-keycloak
    runtime: docker
    dockerfilePath: ./Dockerfile.keycloak
    plan: free
    healthCheckPath: /realms/spendwise/.well-known/openid-configuration
    envVars:
      - key: PORT
        value: 8080
      - key: KC_HTTP_PORT
        value: 8080
      - key: KC_BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: KC_BOOTSTRAP_ADMIN_PASSWORD
        sync: false

  - type: web
    name: spendwise-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    envVars:
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: DATABASE_URL
        fromDatabase:
          name: spendwise-db
          property: connectionString
      - key: KEYCLOAK_ISSUER
        sync: false
      - key: KEYCLOAK_JWKS_URL
        sync: false
      - key: KEYCLOAK_AUDIENCE
        value: spendwise-api
      - key: FRANKFURTER_BASE_URL
        value: https://api.frankfurter.dev
      - key: EXTERNAL_API_TIMEOUT_SECONDS
        value: 5.0
